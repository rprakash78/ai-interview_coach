info:
  name: interview-ai-coach
  type: http

http:
  method: POST
  url: http://localhost:8000/interview/question
  body:
    type: json
    data: |-
      {
        "topic": "javascript",
        "difficulty": "easy",
        "limit": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
